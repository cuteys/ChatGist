#:schema node_modules/wrangler/config-schema.json
name = "chatgist"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[placement]
mode = "smart"

# 可选变量配置（亦可在 Cloudflare Dashboard 中配置）
# [vars]
# AI_BASE_URL = "https://api.openai.com/v1"
# AI_MODEL = "gpt-4o-mini"
# ADMIN_USER_IDS = "123456789"
# LIMIT_SUMMARY = "5"
# LIMIT_ASK = "10"
# LIMIT_QUERY = "20"
# SYSTEM_PROMPT_SUMMARY = "自定义群聊总结 System Prompt..."
# SYSTEM_PROMPT_ASK = "自定义群聊问答 System Prompt..."

# D1 数据库资源绑定
[[d1_databases]]
binding = "DB"
database_name = "chatgist"
database_id = "5ab01338-e174-41b7-b96f-87b8c35782d6"

# 定时汇总触发器（UTC 16:00 即北京时间 00:00 每日定时总结）
[triggers]
crons = ["0 16 * * *"]
